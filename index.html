  <style>
    :root {
      --blue-charcoal: #19191b;
      --button-fluro: #cdffb5;

    * {

    body {
      display: flex;

      min-height: 100vh;

    .eyebrow {

      margin-bottom: 20px;
    }

    .headline {
      font-family: 'DM Serif Display', serif;
      font-style: normal;
      font-weight: 400;
      font-size: 38px;
      line-height: 44px;
      color: #ffffff;
      width: 405px;
      max-width: 100%;
      margin-bottom: 20px;
      overflow: visible;
    }

    .headline .accent {
      color: var(--button-fluro);
    }

    .subline {
      font-family: 'Work Sans', sans-serif;
      font-size: 15px;
      font-weight: 300;
      color: rgba(255,255,255,0.38);
      line-height: 1.75;
      margin-bottom: 40px;
      max-width: 405px;
    }

    .pill-group {
      display: flex;
      gap: 8px;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }

    .pill {
      font-family: 'Libre Franklin', sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 13px;
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.03);
    }

    .divider {
      width: 32px;
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin-bottom: 48px;
    }

    .contact-wrap {
      flex-direction: row;
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-label {
      font-family: 'Libre Franklin', sans-serif;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
      font-weight: 300;
    }

    .contact-btn {
      display: inline-block;
      font-family: 'Work Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--blue-charcoal);
      background: var(--button-fluro);
      padding: 10px 24px;
      border-radius: 100px;
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: opacity 0.15s;
    }

    .contact-btn:hover {
      opacity: 0.85;
    }

    .linkedin-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.35);
      transition: color 0.15s;
      margin-left: 4px;
    }

    .linkedin-icon:hover {
      color: rgba(255,255,255,0.85);

    .footer-note {
      position: fixed;
      bottom: 24px;
      right: 32px;
      font-family: 'Libre Franklin', sans-serif;
      font-size: 10px;
      color: rgba(255,255,255,0.12);
      letter-spacing: 0.08em;

      z-index: 1;

    @media screen and (max-width: 768px) {

        line-height: 36px;
        width: 100%;

</head>
<body>

  <canvas id="lineCanvas"></canvas>

  <div class="lock-root">
    <p class="eyebrow">Hello :)</p>

      Check back when the timing is better.
    </p>
    <div class="pill-group">
      <span class="pill">UX Design</span>

      <span class="pill">Currently heads-down</span>
    </div>
    <div class="divider"></div>
    <div class="contact-wrap">
      <span class="contact-label">Say hello anyway</span>
      <a class="contact-btn" href="mailto:ivan.wowk@gmail.com">ivan.wowk@gmail.com</a>
      <a class="linkedin-icon" href="https://www.linkedin.com/in/ivan-wowk7000" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>
    </div>
  </div>

  <p class="footer-note">back soon · © ivan wowk</p>

  <script>
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');
    let mouse = { x: -9999, y: -9999 };
    let points = [];
    let W, H;
    const BASE_POINTS = 90;
    const CURSOR_RADIUS = 130;
    const CURSOR_STRENGTH = 0.38;
    const SPRING = 0.042;
    const DAMPING = 0.72;
    const CONNECTION_DIST = 115;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function getNumPoints() {
      const area = W * H;
      const baseArea = 1440 * 900;
      const scale = area / baseArea;
      return Math.max(50, Math.round(140 * scale));
    }

    function initPoints() {
      points = [];
      const NUM_POINTS = getNumPoints();
      const NUM_CLUSTERS = 6;
      const clusters = Array.from({ length: NUM_CLUSTERS }, () => ({
        x: Math.random() * W,
        y: Math.random() * H
      }));
      for (let i = 0; i < NUM_POINTS; i++) {
        let ox, oy;
        if (Math.random() < 0.72) {
          const c = clusters[Math.floor(Math.random() * NUM_CLUSTERS)];
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.pow(Math.random(), 0.4) * Math.min(W, H) * 0.30;
          ox = Math.max(0, Math.min(W, c.x + Math.cos(angle) * radius));
          oy = Math.max(0, Math.min(H, c.y + Math.sin(angle) * radius));
        } else {
          ox = Math.random() * W;
          oy = Math.random() * H;
        }
        points.push({ ox, oy, x: ox, y: oy, vx: 0, vy: 0, drift: Math.random() * Math.PI * 2, driftSpeed: 0.002 + Math.random() * 0.002, driftRadius: 12 + Math.random() * 18 });
      }
    }

    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('mouseleave', () => {
      mouse.x = -9999;
      mouse.y = -9999;
    });

    function tick() {
      ctx.clearRect(0, 0, W, H);

      for (let p of points) {
        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < CURSOR_RADIUS && dist > 0) {
          const force = (1 - dist / CURSOR_RADIUS) * CURSOR_STRENGTH;
          p.vx -= (dx / dist) * force * 12;
          p.vy -= (dy / dist) * force * 12;
        }

        p.drift += p.driftSpeed;
        const tx = p.ox + Math.cos(p.drift) * p.driftRadius;
        const ty = p.oy + Math.sin(p.drift) * p.driftRadius;
        p.vx += (tx - p.x) * SPRING;
        p.vy += (ty - p.y) * SPRING;
        p.vx *= DAMPING;
        p.vy *= DAMPING;
        p.x += p.vx;
        p.y += p.vy;
      }

      for (let i = 0; i < points.length; i++) {
        for (let j = i + 1; j < points.length; j++) {
          const a = points[i];
          const b = points[j];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < CONNECTION_DIST) {
            const alpha = (1 - dist / CONNECTION_DIST) * 0.45;
            const aDist = Math.hypot(mouse.x - a.x, mouse.y - a.y);
            const bDist = Math.hypot(mouse.x - b.x, mouse.y - b.y);
            const nearCursor = Math.min(aDist, bDist) < CURSOR_RADIUS;

            if (nearCursor) {
              const intensity = 1 - Math.min(aDist, bDist) / CURSOR_RADIUS;
              const r = Math.round(205 * intensity + 255 * (1 - intensity));
              const g = 255;
              const bl = Math.round(181 * intensity + 255 * (1 - intensity));
              ctx.strokeStyle = `rgba(${r},${g},${bl},${alpha + intensity * 0.4})`;
              ctx.lineWidth = 0.8 + intensity * 0.8;
            } else {
              ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.5})`;
              ctx.lineWidth = 0.5;
            }

            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      for (let p of points) {
        const d = Math.hypot(mouse.x - p.x, mouse.y - p.y);
        const near = d < CURSOR_RADIUS;
        const intensity = near ? (1 - d / CURSOR_RADIUS) : 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, near ? 1.5 + intensity * 2 : 1.2, 0, Math.PI * 2);
        ctx.fillStyle = near
          ? `rgba(205,255,181,${0.4 + intensity * 0.6})`
          : `rgba(255,255,255,0.2)`;
        ctx.fill();
      }

      requestAnimationFrame(tick);
    }

    resize();
    initPoints();
    tick();
    window.addEventListener('resize', () => { resize(); initPoints(); });
  </script>

</body>
